name: release-please
on:
  push:
    branches: [__DEFAULT_BRANCH__]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a reviewed commit SHA (supply-chain hygiene); Dependabot can bump it.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use a PAT or GitHub App token if release PRs must trigger CI workflows.
          token: ${{ secrets.GITHUB_TOKEN }}

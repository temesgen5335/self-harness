name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }    # oldest supported (README: python3 >= 3.8)
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }   # bash 3.2 + BSD tools, as on most laptops
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for test repos
        run: git config --global user.name "harness-ci" && git config --global user.email "ci@example.invalid"
      - name: Tests
        run: python3 -I tests/test_harness.py
